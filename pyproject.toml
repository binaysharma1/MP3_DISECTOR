[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amrit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.1.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.0",
    "streamlit>=1.62.0",
    "torchaudio>=2.11.0",
]

[tool.setuptools]
py-modules = ["backend", "page"]
